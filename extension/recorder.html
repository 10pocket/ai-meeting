<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<title>ai-meeting recorder</title>
<style>
  body { font: 14px/1.6 system-ui, sans-serif; max-width: 560px; margin: 32px auto; }
  label { display: block; margin: 12px 0 } input { width: 100%; box-sizing: border-box; padding: 6px }
  #status { margin: 16px 0; white-space: pre-wrap } .rec { color: #c00; font-weight: bold }
</style>
<h1>ai-meeting recorder</h1>
<p id="target"></p>
<label>サーバー <input id="server" placeholder="https://ai-meeting.example.com"></label>
<button id="start">録画開始</button>
<button id="stop" disabled>停止して送信</button>
<p id="status">準備中…</p>
<p><small>このタブは録画中ずっと開いたままにしてください。会議タブを閉じると自動で停止します。</small></p>
<script src="recorder.js"></script>
