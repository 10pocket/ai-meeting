<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ai-meeting 録画</title>
<style>
  /* 値は docs/ui-rules.md のトークン。public/index.html と同じ値に保つ */
  :root {
    --bg: #f5f7f8; --surface: #fff; --ink: #16202a; --muted: #5b6773; --line: #dfe4e8;
    --accent: #0f766e; --accent-ink: #fff; --accent-soft: #e1f4f1;
    --rec: #c62828; --warn: #a15c07; --ok: #15803d;
    --r-ctl: 6px; --r-panel: 8px;
    --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px;
    --font: "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", Meiryo, system-ui, sans-serif;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0e141b; --surface: #151c25; --ink: #e6edf3; --muted: #9aa7b4; --line: #27323d;
      --accent: #5eead4; --accent-ink: #06201c; --accent-soft: #12302d; --rec: #f87171; --warn: #fbbf24; --ok: #4ade80; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: var(--s6) var(--s4); font: 14px/1.7 var(--font); color: var(--ink); background: var(--bg); }
  main { max-width: 36em; margin: 0 auto; }
  main > * + * { margin-top: var(--s4); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  h1, p { margin: 0; } h1 { font-size: 20px; line-height: 1.4; }
  a { color: var(--accent); }
  .note { color: var(--muted); font-size: 12px; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-panel); padding: var(--s4); }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: var(--s1); }
  input { width: 100%; min-height: 36px; padding: 0 var(--s3); font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: var(--r-ctl); }
  .row { display: flex; gap: var(--s2); flex-wrap: wrap; }
  .btn { min-height: 36px; padding: 0 var(--s4); font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-ctl); cursor: pointer; }
  .btn:hover { border-color: var(--muted); }
  .btn-primary { color: var(--accent-ink); background: var(--accent); border-color: var(--accent); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  #status { min-height: 1.7em; }
  #status.rec { color: var(--rec); font-weight: 600; } #status.err { color: var(--rec); } #status.ok { color: var(--ok); }
</style>
<main>
  <h1>ai-meeting 録画</h1>
  <p id="target" class="note"></p>
  <div class="panel">
    <label for="server">サーバーの URL</label>
    <input id="server" placeholder="https://ai-meeting.example.com">
  </div>
  <div class="row">
    <button id="start" class="btn btn-primary" disabled>録画を開始</button>
    <button id="stop" class="btn" disabled>停止して送信</button>
  </div>
  <p id="status" role="status" aria-live="polite">準備中…</p>
  <p class="note">録画中は、このタブを開いたままにしてください。会議のタブを閉じると、自動で停止して送信します。</p>
</main>
<script src="recorder.js"></script>
