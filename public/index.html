<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ai-meeting</title>
<style>
  /* 値は docs/ui-rules.md のトークン。extension/recorder.html と同じ値に保つ */
  :root {
    --bg: #f5f7f8; --surface: #fff; --ink: #16202a; --muted: #5b6773; --line: #dfe4e8;
    --accent: #0f766e; --accent-ink: #fff; --accent-soft: #e1f4f1;
    --rec: #c62828; --warn: #a15c07; --ok: #15803d;
    --series-1: #2a78d6; --series-2: #eb6834; /* グラフの系列色 (管理画面だけで使う) */
    --r-ctl: 6px; --r-panel: 8px;
    --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px;
    --font: "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", Meiryo, system-ui, sans-serif;
    --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0e141b; --surface: #151c25; --ink: #e6edf3; --muted: #9aa7b4; --line: #27323d;
      --accent: #5eead4; --accent-ink: #06201c; --accent-soft: #12302d; --rec: #f87171; --warn: #fbbf24; --ok: #4ade80;
      --series-1: #3987e5; --series-2: #d95926; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.7 var(--font); color: var(--ink); background: var(--bg); display: grid; grid-template-columns: 320px 1fr; height: 100vh; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  h1, h2, h3, p { margin: 0; }
  a { color: var(--accent); }

  nav { border-right: 1px solid var(--line); background: var(--surface); overflow: auto; }
  nav h1 { font-size: 16px; padding: var(--s4); border-bottom: 1px solid var(--line); }
  nav a { display: block; padding: var(--s3) var(--s4); color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--line); border-left: 3px solid transparent; }
  nav a:hover { background: var(--bg); }
  nav a[aria-current] { background: var(--accent-soft); border-left-color: var(--accent); }
  .item-title { font-weight: 600; overflow-wrap: anywhere; }
  .item-meta { display: flex; gap: var(--s3); align-items: center; color: var(--muted); font-size: 12px; }
  .empty { padding: var(--s4); color: var(--muted); }

  main { overflow: auto; padding: var(--s5) var(--s6); }
  main > * { max-width: 52em; }
  main > * + * { margin-top: var(--s4); }
  h2 { font-size: 20px; line-height: 1.4; display: flex; gap: var(--s3); align-items: center; flex-wrap: wrap; }
  video { width: 100%; max-height: 45vh; background: #000; border-radius: var(--r-panel); }
  .row { display: flex; gap: var(--s2); flex-wrap: wrap; }
  .note { color: var(--muted); font-size: 12px; }
  .err { color: var(--rec); }

  .badge { display: inline-flex; align-items: center; gap: var(--s1); font-size: 12px; font-weight: 400; color: var(--muted); }
  .badge::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .st-recording { color: var(--rec); } .st-processing { color: var(--warn); } .st-done { color: var(--ok); } .st-error { color: var(--rec); }

  .btn { display: inline-flex; align-items: center; min-height: 36px; padding: 0 var(--s4); font: inherit; color: var(--ink); background: var(--surface);
    border: 1px solid var(--line); border-radius: var(--r-ctl); text-decoration: none; cursor: pointer; }
  .btn:hover { border-color: var(--muted); }
  .btn-primary { color: var(--accent-ink); background: var(--accent); border-color: var(--accent); }
  .btn-danger { color: var(--rec); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn-copy { width: 36px; padding: 0; justify-content: center; color: var(--muted); transition: color .15s, background-color .15s, border-color .15s; }
  .btn-copy:hover { color: var(--accent); border-color: var(--accent); }
  .btn-copy svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
  .btn-copy .i-check { display: none; }
  .btn-copy.done { color: var(--accent); background: var(--accent-soft); border-color: var(--accent); }
  .btn-copy.done .i-clip { display: none; } .btn-copy.done .i-check { display: inline; }
  .btn-copy.fail { color: var(--rec); border-color: var(--rec); }
  .copy-tools { display: flex; align-items: center; gap: var(--s2); }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  @media (prefers-reduced-motion: reduce) { .btn-copy { transition: none; } }

  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-panel); }
  .panel > header { display: flex; justify-content: space-between; align-items: center; gap: var(--s3); padding: var(--s2) var(--s4); border-bottom: 1px solid var(--line); }
  .panel h3 { font-size: 16px; }
  .panel pre { margin: 0; padding: var(--s4); white-space: pre-wrap; overflow-wrap: anywhere; font: inherit; line-height: 1.8; }
  .ts { font: 12px var(--mono); color: var(--accent); background: var(--accent-soft); border: 0; border-radius: 4px; padding: 1px 6px; cursor: pointer; }
  .ts:hover { text-decoration: underline; }
  ol { padding-left: var(--s5); }
  nav h1 { display: flex; justify-content: space-between; align-items: center; }
  nav h1 a { display: inline; padding: 0; border: 0; font-size: 14px; font-weight: 400; color: var(--accent); text-decoration: underline; }
  nav h1 a:hover { background: none; }
  .body { padding: var(--s4); }
  .body > * + * { margin-top: var(--s3); }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: var(--s1) var(--s2); border-bottom: 1px solid var(--line); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .stats { display: flex; gap: var(--s6); flex-wrap: wrap; }
  .stat-label { color: var(--muted); font-size: 12px; }
  .stat-value { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .legend { display: flex; gap: var(--s4); font-size: 12px; color: var(--muted); }
  .legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: var(--s1); background: var(--c); vertical-align: -1px; }
  .chart { width: 100%; height: auto; display: block; }
  .chart text { fill: var(--muted); font: 11px var(--font); }
  .chart .grid { stroke: var(--line); }
  .chart g:hover rect { opacity: .8; }
  .spk { display: grid; grid-template-columns: auto 1fr; gap: var(--s2) var(--s3); align-items: center; max-width: 28em; }
  .spk input { font: inherit; color: var(--ink); background: var(--surface); min-height: 36px; padding: 0 var(--s2); border: 1px solid var(--line); border-radius: var(--r-ctl); }

  @media (max-width: 760px) {
    body { grid-template-columns: 1fr; height: auto; }
    nav { max-height: 40vh; border-right: 0; border-bottom: 1px solid var(--line); }
    main { padding: var(--s4); }
  }
</style>
<nav>
  <h1>ai-meeting <a href="#admin">管理</a></h1>
  <div id="list"></div>
</nav>
<main id="main" aria-live="polite"></main>
<script>
const $ = s => document.querySelector(s);
const api = (p, init) => fetch('/api' + p, init).then(r => r.json());
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const ST = { recording: '録画中', processing: '処理中', done: '完了', error: 'エラー' };
const badge = s => `<span class="badge st-${s}">${ST[s] || s}</span>`;
let current = location.hash.slice(1), items = [], rec = null;
const usd = n => n == null ? '単価未設定' : '$' + n.toFixed(3);
const mb = n => n >= 1e9 ? (n / 1e9).toFixed(2) + ' GB' : (n / 1e6).toFixed(1) + ' MB';
const API = { transcribe: '文字起こし', minutes: '議事録' };
const named = t => t && t.replace(/話者\d+/g, k => rec.speakers?.[k] || k); // 表示とコピーにだけ話者名を当てる。ファイルは話者N のまま

const intro = () => `
  <h2>録画を選んでください</h2>
  <p>左の一覧から選ぶと、議事録と録画を開けます。録画は Chrome 拡張から始めます。</p>
  <div class="panel"><header><h3>Chrome 拡張を入れる</h3><a class="btn btn-primary" href="/extension.zip">extension.zip をダウンロード</a></header>
    <pre>1. zip を展開する。
2. <code>chrome://extensions</code> を開き、デベロッパーモードをオンにする。
3. 「パッケージ化されていない拡張機能を読み込む」で、展開した <code>extension</code> フォルダを選ぶ。
4. 会議のタブで拡張のアイコンを押し、録画ページで「録画を開始」を押す。</pre></div>`;

async function loadList() {
  items = await api('/recordings');
  $('#list').innerHTML = items.length ? items.map(r => `<a href="#${r.id}" ${r.id === current ? 'aria-current="page"' : ''}>
    <div class="item-title">${esc(r.title)}</div>
    <div class="item-meta"><span>${new Date(r.createdAt).toLocaleString('ja-JP', { dateStyle: 'short', timeStyle: 'short' })}</span>${badge(r.status)}</div></a>`).join('')
    : '<p class="empty">まだ録画がありません。Chrome 拡張から録画を始めてください。</p>';
}
async function show(id) {
  current = id;
  rec = await api('/recordings/' + id);
  if (rec.error && !rec.id) { $('#main').innerHTML = `<p class="err" role="alert">${esc(rec.error)} 一覧から選び直してください。</p>`; return; }
  const r = rec, f = n => `/recordings/${id}/${n}`, busy = r.status === 'processing' || r.status === 'recording';
  const spk = [...new Set(r.transcript?.match(/話者\d+/g) || [])].sort((a, b) => a.slice(2) - b.slice(2));
  const total = r.usage.reduce((a, e) => a + (e.usd || 0), 0), unpriced = r.usage.some(e => e.usd == null);
  $('#main').innerHTML = `
    <h2>${esc(r.title)} ${badge(r.status)}</h2>
    ${r.error ? `<p class="err" role="alert">処理に失敗しました: ${esc(r.error)} 「再処理」でやり直せます。</p>` : ''}
    ${r.warning ? `<p class="note">${esc(r.warning)}</p>` : ''}
    ${r.status !== 'recording' ? `<video controls preload="metadata" src="${f('recording.webm')}"></video>` : ''}
    <div class="row">
      <button class="btn" data-act="reprocess" ${busy ? 'disabled' : ''}>再処理</button>
      <button class="btn btn-danger" data-act="delete">削除</button>
    </div>
    ${spk.length ? `<section class="panel"><header><h3>話者</h3><button class="btn" data-act="speakers">話者名を保存</button></header>
      <div class="body"><datalist id="names">${r.names.map(n => `<option value="${esc(n)}">`).join('')}</datalist>
      <div class="spk">${spk.map(k => `<label for="spk-${k}">${k}</label><input id="spk-${k}" data-spk="${k}" list="names" maxlength="50" value="${esc(r.speakers?.[k] || '')}" placeholder="名前 (空なら ${k} のまま)">`).join('')}</div>
      <p class="note" id="spk-msg" role="status">候補は過去に付けた名前。議事録と文字起こしの表示とコピーに反映する。</p></div></section>` : ''}
    ${r.minutes ? `<section class="panel"><header><h3>議事録</h3><div class="copy-tools"><span id="copy-msg" role="status"></span><button class="btn btn-copy" data-act="copy" title="Markdown をコピー" aria-label="Markdown をコピー"><svg class="i-clip" viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></svg><svg class="i-check" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 13l4 4L19 7"/></svg></button></div></header><pre>${esc(named(r.minutes))}</pre></section>` : ''}
    ${r.transcript ? `<section class="panel"><header><h3>文字起こし</h3></header><pre>${esc(named(r.transcript))}</pre></section>` : ''}
    <section class="panel"><header><h3>利用料とサイズ</h3></header><div class="body">
      <div class="stats"><div><div class="stat-label">概算利用料</div><div class="stat-value">${r.usage.length ? usd(total) : '—'}</div></div>
        <div><div class="stat-label">保存サイズ</div><div class="stat-value">${mb(r.bytes)}</div></div></div>
      ${r.usage.length ? `<table><thead><tr><th>日時</th><th>API</th><th>モデル</th><th class="num">量</th><th class="num">USD</th></tr></thead><tbody>${r.usage.map(e => `<tr>
        <td>${new Date(e.at).toLocaleString('ja-JP', { dateStyle: 'short', timeStyle: 'short' })}</td><td>${API[e.api] || e.api}</td><td>${esc(e.model)}</td>
        <td class="num">${e.api === 'transcribe' ? (e.seconds / 60).toFixed(1) + ' 分' : `入力 ${e.inputTokens} / 出力 ${e.outputTokens} tokens`}</td><td class="num">${usd(e.usd)}</td></tr>`).join('')}</tbody></table>
        <p class="note">単価から計算した概算。再処理するとその分も足される。${unpriced ? '単価未設定の分は合計に入っていない。' : ''}</p>` : '<p class="note">利用料の記録はない (記録を始める前に処理した録画)。</p>'}
    </div></section>`;
  // [hh:mm:ss] を押せるチップにする。押すと動画がその位置へ飛ぶ
  $('#main').querySelectorAll('pre').forEach(pre => pre.innerHTML = pre.innerHTML.replace(/\[(\d\d):(\d\d):(\d\d)\]/g,
    (m, h, mi, s) => `<button type="button" class="ts" data-t="${h * 3600 + mi * 60 + +s}">${m.slice(1, -1)}</button>`));
  loadList();
}
$('#main').addEventListener('click', async e => {
  const ts = e.target.closest('.ts'), b = e.target.closest('[data-act]');
  if (ts) { const v = $('video'); if (v) { v.currentTime = +ts.dataset.t; v.play(); } return; }
  if (!b) return;
  if (b.dataset.act === 'copy') {
    const msg = $('#copy-msg');
    try { await navigator.clipboard.writeText(named(rec.minutes)); b.classList.add('done'); msg.className = 'sr-only'; msg.textContent = 'コピーしました'; }
    catch { b.classList.add('fail'); msg.className = 'note err'; msg.textContent = 'コピーできません。HTTPS で開いてください。'; }
    setTimeout(() => { b.classList.remove('done', 'fail'); msg.textContent = ''; }, 2000);
  } else if (b.dataset.act === 'speakers') {
    const body = Object.fromEntries([...document.querySelectorAll('[data-spk]')].map(i => [i.dataset.spk, i.value]));
    const r = await fetch(`/api/recordings/${current}/speakers`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    if (r.ok) show(current); else { const m = $('#spk-msg'); m.className = 'note err'; m.textContent = `保存できません: ${(await r.json()).error}。名前は 50 文字以内にする。`; }
  } else if (b.dataset.act === 'reprocess') { await api(`/recordings/${current}/reprocess`, { method: 'POST' }); show(current); }
  else if (b.dataset.act === 'delete' && confirm('この録画を削除します。元に戻せません。')) {
    await api('/recordings/' + current, { method: 'DELETE' }); location.hash = ''; current = ''; $('#main').innerHTML = intro(); loadList();
  }
});
async function showAdmin() {
  loadList();
  const a = await api('/admin'), now = new Date(), by = Object.fromEntries(a.months.map(m => [m.month, m]));
  const months = Array.from({ length: 12 }, (_, i) => { // 直近 12 か月。記録のない月は 0
    const d = new Date(now.getFullYear(), now.getMonth() - 11 + i, 1), k = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
    return by[k] || { month: k, transcribe: 0, minutes: 0 };
  });
  const sum = m => m.transcribe + m.minutes, peak = Math.max(...months.map(sum)), W = 600, H = 200, top = 16, bw = W / 12;
  const y = v => (H - top) * v / (peak || 1);
  const bars = months.map((m, i) => { const x = i * bw + bw * .2, w = bw * .6, h1 = y(m.transcribe), h2 = y(m.minutes);
    return `<g><title>${m.month}  文字起こし ${usd(m.transcribe)} / 議事録 ${usd(m.minutes)} / 計 ${usd(sum(m))}</title>
      <rect x="${i * bw}" y="${top}" width="${bw}" height="${H - top}" fill="transparent"/>
      ${h1 ? `<rect x="${x}" y="${H - h1}" width="${w}" height="${h1}" rx="2" fill="var(--series-1)"/>` : ''}
      ${h2 ? `<rect x="${x}" y="${H - h1 - h2 - (h1 ? 2 : 0)}" width="${w}" height="${h2}" rx="2" fill="var(--series-2)"/>` : ''}
      <text x="${i * bw + bw / 2}" y="${H + 16}" text-anchor="middle">${+m.month.slice(5)}月</text></g>`; }).join('');
  $('#main').innerHTML = `
    <h2>管理</h2>
    <section class="panel"><header><h3>概要</h3></header><div class="body"><div class="stats">
      <div><div class="stat-label">今月の概算利用料</div><div class="stat-value">${usd(sum(months.at(-1)))}</div></div>
      <div><div class="stat-label">録画の保存量</div><div class="stat-value">${mb(a.storage.recordings)}</div></div>
      <div><div class="stat-label">話者分離モデル</div><div class="stat-value">${mb(a.storage.models)}</div></div></div></div></section>
    <section class="panel"><header><h3>月ごとの概算利用料 (USD)</h3><div class="legend"><span style="--c: var(--series-1)">文字起こし</span><span style="--c: var(--series-2)">議事録</span></div></header><div class="body">
      <svg class="chart" viewBox="0 -4 ${W} ${H + 24}" role="img" aria-label="月ごとの概算利用料の棒グラフ。数値は下の表にある">
        <line class="grid" x1="0" x2="${W}" y1="${top}" y2="${top}"/><line class="grid" x1="0" x2="${W}" y1="${H}" y2="${H}"/>
        <text x="0" y="${top - 4}">${usd(peak)}</text>${bars}</svg>
      <table><thead><tr><th>月</th><th class="num">文字起こし</th><th class="num">議事録</th><th class="num">計</th></tr></thead><tbody>
        ${months.filter(sum).reverse().map(m => `<tr><td>${m.month}</td><td class="num">${usd(m.transcribe)}</td><td class="num">${usd(m.minutes)}</td><td class="num">${usd(sum(m))}</td></tr>`).join('') || '<tr><td colspan="4">まだ記録がない。録画を処理すると、ここに出る。</td></tr>'}
      </tbody></table>
      <p class="note">単価から計算した概算で、実際の請求額とはずれることがある。削除した録画の分も含む。</p></div></section>`;
}
const route = () => { current = location.hash.slice(1); current === 'admin' ? showAdmin() : current ? show(current) : ($('#main').innerHTML = intro(), loadList()); };
onhashchange = route;
route();
setInterval(() => {
  const cur = items.find(r => r.id === current);
  if (cur && (cur.status === 'recording' || cur.status === 'processing')) show(current); // 表示中の録画だけ描き直す (再生位置を保つため)
  else if (items.some(r => r.status === 'recording' || r.status === 'processing')) loadList();
}, 5000);
</script>
